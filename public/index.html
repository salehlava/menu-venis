<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0F4C3A">
  <meta name="description" content="Venice Café menu — منوی کافه ونیز">
  <title>منوی کافه ونیز</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='31' fill='%230F4C3A'/%3E%3Ccircle cx='32' cy='32' r='27' fill='none' stroke='%23D49A8F' stroke-width='2'/%3E%3Cpath d='M20 20l12 26 12-26' fill='none' stroke='%23EBC9BC' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/style.css">

  <script>
    // Set language + direction before first paint to avoid a layout flash.
    (function () {
      var lang = new URLSearchParams(location.search).get("lang");
      if (lang !== "en" && lang !== "fa") {
        try { lang = localStorage.getItem("venice-menu-lang"); } catch (e) {}
      }
      if (lang === "en" || lang === "fa") {
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";
      }
    })();
  </script>
</head>
<body>
  <header class="hero">
    <div class="container hero__bar">
      <span class="hero__label" data-i18n="menu"></span>
      <div class="hero__actions">
        <a class="pill hero__club" id="clubLink" href="#club" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="8.5" width="17" height="5" rx="1"/><path d="M5 13.5v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6M12 8.5v12"/><path d="M12 8.5S10.8 3.5 8 3.5a2.5 2.5 0 0 0 0 5M12 8.5s1.2-5 4-5a2.5 2.5 0 0 1 0 5"/></svg>
          <span data-i18n="clubShort"></span>
        </a>
        <div class="pill lang" role="group" aria-label="Language / زبان">
          <button type="button" data-lang="fa" lang="fa">فا</button>
          <button type="button" data-lang="en" lang="en">EN</button>
        </div>
      </div>
    </div>

    <div class="container brand">
      <div class="logo" aria-hidden="true"><span>V</span></div>
      <h1 class="brand__name" data-i18n="name"></h1>
      <p class="brand__tagline" data-i18n="tagline"></p>
      <div class="ornament" aria-hidden="true">
        <i></i>
        <svg viewBox="0 0 10 10"><path d="M5 0l5 5-5 5-5-5z" fill="currentColor"/></svg>
        <i></i>
      </div>
    </div>
  </header>

  <div class="container search">
    <label class="search__box">
      <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="sr-only" data-i18n="searchLabel"></span>
      <input id="search" class="search__input" type="search" autocomplete="off" enterkeyhint="search">
      <button type="button" id="searchClear" class="search__clear" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </label>
    <p class="price-note" data-i18n="priceNote"></p>
  </div>

  <nav class="cat-nav" id="catNav">
    <div class="cat-nav__list" id="catList"></div>
  </nav>

  <main class="container menu" id="menu" aria-live="polite"></main>

  <div class="container empty" id="empty" hidden>
    <div class="empty__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8.5 11h5"/></svg>
    </div>
    <p class="empty__title" data-i18n="empty"></p>
    <p class="empty__hint" data-i18n="emptyHint"></p>
  </div>

  <!-- Customer Club -->
  <section class="club" id="club" hidden aria-labelledby="clubTitle">
    <div class="container">
      <div class="club__card">
        <div class="club__intro">
          <span class="club__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="8.5" width="17" height="5" rx="1"/><path d="M5 13.5v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6M12 8.5v12"/><path d="M12 8.5S10.8 3.5 8 3.5a2.5 2.5 0 0 0 0 5M12 8.5s1.2-5 4-5a2.5 2.5 0 0 1 0 5"/></svg>
          </span>
          <h2 class="club__title" id="clubTitle" data-i18n="clubTitle"></h2>
          <p class="club__text" data-i18n="clubText"></p>
        </div>

        <form class="club__form" id="clubForm" novalidate>
          <div class="form-row">
            <div class="field">
              <label for="clubName" data-i18n="fieldName"></label>
              <input id="clubName" name="name" autocomplete="name" maxlength="60" required>
            </div>
            <div class="field">
              <label for="clubPhone" data-i18n="fieldPhone"></label>
              <input id="clubPhone" name="phone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" placeholder="09xx xxx xxxx" maxlength="16" required>
            </div>
          </div>

          <div class="field" role="group" aria-labelledby="clubBirthdayLabel">
            <span class="field__label" id="clubBirthdayLabel"><span data-i18n="fieldBirthday"></span> <span class="field__optional" data-i18n="optional"></span></span>
            <div class="field__row">
              <select id="clubDay" name="day"></select>
              <select id="clubMonth" name="month"></select>
            </div>
          </div>

          <div class="hp" aria-hidden="true">
            <label>Website <input name="website" tabindex="-1" autocomplete="off"></label>
          </div>

          <label class="check">
            <input type="checkbox" id="clubConsent" name="consent">
            <span data-i18n="consent"></span>
          </label>

          <button type="submit" class="club__submit" id="clubSubmit" data-i18n="join"></button>
          <p class="club__msg" id="clubMsg" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </section>

  <noscript>
    <p class="container noscript">Please enable JavaScript to view the menu. — برای مشاهده منو، جاوااسکریپت را فعال کنید.</p>
  </noscript>

  <footer class="footer">
    <div class="container">
      <div class="logo logo--sm" aria-hidden="true"><span>V</span></div>
      <p class="footer__name" data-i18n="name"></p>
      <ul class="footer__info" id="footerInfo"></ul>
      <p class="footer__note" data-i18n="priceNote"></p>
      <p class="footer__copy" id="footerCopy"></p>
    </div>
  </footer>

  <button type="button" class="to-top" id="toTop">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <script src="/js/menu-data.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
